<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weighted Grade Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --bg-accent: #eef2ff;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --danger: #ef4444;
      --danger-soft: #fef2f2;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --row-hover: #f8fafc;
      --row-highlight: #f1f5f9;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --bg-accent: #1e1b4b;
      --card: #111827;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-soft: rgba(99, 102, 241, 0.15);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.15);
      --success: #34d399;
      --warning: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --row-hover: #1e293b;
      --row-highlight: #162032;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 1rem 4rem 1rem;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Top Gradient Accent Bar */
    .top-bar {
      height: 5px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4, #10b981);
      margin: 0 -1rem 2rem -1rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      box-shadow: var(--shadow-md);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
      display: block;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: var(--row-hover);
      border-color: var(--muted);
    }

    .btn-icon {
      padding: 0.55rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--muted);
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
    }
    .btn-danger-ghost:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* Tabs Navigation */
    .tabs-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      white-space: nowrap;
      position: relative;
    }

    .tab-btn:hover {
      background: var(--row-hover);
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: rgba(79, 70, 229, 0.25);
    }

    .tab-close {
      margin-left: 0.4rem;
      font-size: 1rem;
      opacity: 0.6;
      padding: 0 4px;
      border-radius: 4px;
    }
    .tab-close:hover {
      opacity: 1;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-add-tab {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      padding: 0.55rem 0.9rem;
      white-space: nowrap;
    }
    .btn-add-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* Scoreboard Card */
    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 1rem;
      z-index: 20;
    }

    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tab-title-edit {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tab-name-input {
      font-size: 1rem;
      font-weight: 700;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      width: 220px;
    }
    .tab-name-input:hover, .tab-name-input:focus {
      border-color: var(--border);
      background: var(--bg);
      outline: none;
    }

    .combine-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      background: var(--bg);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.85rem;
      font-weight: 800;
      margin-top: 0.2rem;
      letter-spacing: -0.02em;
    }

    .stat-subtext {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
      font-weight: 500;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      margin-top: 1.15rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      border-radius: 999px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .weight-ok { color: var(--success); }
    .weight-warn { color: var(--warning); }
    .weight-over { color: var(--danger); }

    /* Category Cards */
    .category-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.35rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-md);
      transition: transform 0.15s ease;
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }

    .category-title-input {
      font-size: 1.1rem;
      font-weight: 700;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      color: var(--text);
      background: transparent;
      width: 100%;
      max-width: 340px;
    }

    .category-title-input:hover,
    .category-title-input:focus {
      border-color: var(--border);
      background: var(--bg);
      outline: none;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    td {
      padding: 0.55rem 0.5rem;
      vertical-align: middle;
    }

    /* Section Total Footer Row */
    tfoot tr {
      background-color: var(--row-highlight);
      border-top: 2px solid var(--border);
      font-weight: 700;
    }

    tfoot td {
      padding: 0.8rem 0.5rem;
      color: var(--text);
      font-size: 0.9rem;
    }

    tfoot td:first-child {
      border-bottom-left-radius: 8px;
    }

    tfoot td:last-child {
      border-bottom-right-radius: 8px;
    }

    .section-total-earned {
      color: var(--primary);
      font-weight: 800;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      color: var(--text);
      background: var(--card);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .earned-badge {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .card-footer {
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="top-bar"></div>

<div class="container">
  <header>
    <div class="brand">
      <div class="brand-icon">%</div>
      <div>
        <h1>Grade Calculator</h1>
        <span class="subtitle">Customizable weighted scoring & multi-sheet tracker</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="theme-toggle" title="Toggle Dark Mode" onclick="toggleTheme()">🌙</button>
      <button class="btn-outline" onclick="resetToDefault()">Reset Default</button>
      <button class="btn-primary" onclick="addCategory()">+ Add Section</button>
    </div>
  </header>

  <!-- Tabs Bar -->
  <div class="tabs-wrapper" id="tabs-bar"></div>

  <!-- Live Scoreboard -->
  <div class="summary-card">
    <div class="summary-top">
      <div class="tab-title-edit">
        <span style="font-size: 0.85rem; color: var(--muted);">Sheet Name:</span>
        <input type="text" class="tab-name-input" id="active-tab-name" oninput="renameActiveTab(this.value)" />
      </div>

      <label class="combine-toggle" title="Sum points across all open tabs">
        <input type="checkbox" id="combine-tabs-checkbox" onchange="toggleCombineMode(this.checked)" />
        <span>Combine All Tabs</span>
      </label>
    </div>

    <div class="summary-grid">
      <div class="stat-box">
        <span class="stat-label" id="points-label">Total Weighted Points</span>
        <span class="stat-value" id="total-points" style="color: var(--primary);">0.00 / 100</span>
        <span class="stat-subtext" id="points-subtext">Current sheet accumulated points</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">Percentage Score</span>
        <span class="stat-value" id="total-grade">0.00%</span>
        <span class="stat-subtext">Based on earned weight</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">Total Weight Allocated</span>
        <span class="stat-value" id="total-weight">100%</span>
        <span class="stat-subtext" id="weight-status"></span>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="grade-progress-bar"></div>
    </div>
  </div>

  <!-- Dynamic Categories Container -->
  <div id="categories-container"></div>
</div>

<script>
  const defaultTabs = [
    {
      id: "tab-1",
      name: "ECE Review Main",
      categories: [
        {
          id: 1,
          name: "GRADED TASKS",
          items: [
            { id: 101, subject: "Elex 1", score: "", max: 60, weight: 6 },
            { id: 102, subject: "Elex 2", score: "", max: 60, weight: 6 },
            { id: 103, subject: "Math 1", score: "", max: 40, weight: 8 },
            { id: 104, subject: "Est 1",  score: "", max: 60, weight: 6 },
            { id: 105, subject: "Est 2",  score: "", max: 60, weight: 6 },
            { id: 106, subject: "Geas 1", score: "", max: 80, weight: 8 }
          ]
        },
        {
          id: 2,
          name: "FINALS",
          items: [
            { id: 201, subject: "Elex", score: "", max: 90, weight: 18 },
            { id: 202, subject: "Math", score: "", max: 50, weight: 12 },
            { id: 203, subject: "Est",  score: "", max: 90, weight: 18 },
            { id: 204, subject: "Geas", score: "", max: 80, weight: 12 }
          ]
        }
      ]
    }
  ];

  let appState = JSON.parse(localStorage.getItem("gradeCalcMultiTab")) || {
    activeTabId: "tab-1",
    combineAll: false,
    tabs: structuredClone(defaultTabs)
  };

  // Theme initialization
  const savedTheme = localStorage.getItem("gradeCalcTheme") || "light";
  if (savedTheme === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    document.getElementById("theme-toggle").textContent = "☀️";
  }

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    if (isDark) {
      document.documentElement.removeAttribute("data-theme");
      localStorage.setItem("gradeCalcTheme", "light");
      document.getElementById("theme-toggle").textContent = "🌙";
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      localStorage.setItem("gradeCalcTheme", "dark");
      document.getElementById("theme-toggle").textContent = "☀️";
    }
  }

  function saveData() {
    localStorage.setItem("gradeCalcMultiTab", JSON.stringify(appState));
  }

  function getActiveTab() {
    return appState.tabs.find(t => t.id === appState.activeTabId) || appState.tabs[0];
  }

  function switchTab(tabId) {
    appState.activeTabId = tabId;
    saveData();
    render();
  }

  function addNewTab() {
    const newId = "tab-" + Date.now();
    const tabNumber = appState.tabs.length + 1;
    appState.tabs.push({
      id: newId,
      name: `Extra Subjects #${tabNumber - 1}`,
      categories: [
        {
          id: Date.now() + 1,
          name: "ADDITIONAL SUBJECTS",
          items: [
            { id: Date.now() + 2, subject: "New Subject 1", score: "", max: 50, weight: 10 },
            { id: Date.now() + 3, subject: "New Subject 2", score: "", max: 50, weight: 10 }
          ]
        }
      ]
    });
    appState.activeTabId = newId;
    saveData();
    render();
  }

  function removeTab(event, tabId) {
    event.stopPropagation();
    if (appState.tabs.length <= 1) {
      alert("You must have at least one tab open.");
      return;
    }
    if (confirm("Delete this tab and all its subjects?")) {
      appState.tabs = appState.tabs.filter(t => t.id !== tabId);
      if (appState.activeTabId === tabId) {
        appState.activeTabId = appState.tabs[0].id;
      }
      saveData();
      render();
    }
  }

  function renameActiveTab(newName) {
    const tab = getActiveTab();
    tab.name = newName || "Untitled Sheet";
    saveData();
    renderTabs();
  }

  function toggleCombineMode(checked) {
    appState.combineAll = checked;
    saveData();
    recalculateTotals();
  }

  function renderTabs() {
    const tabsBar = document.getElementById("tabs-bar");
    tabsBar.innerHTML = "";

    appState.tabs.forEach(tab => {
      const btn = document.createElement("button");
      btn.className = `tab-btn ${tab.id === appState.activeTabId ? "active" : ""}`;
      btn.onclick = () => switchTab(tab.id);

      const closeHtml = appState.tabs.length > 1
        ? `<span class="tab-close" title="Close Tab" onclick="removeTab(event, '${tab.id}')">&times;</span>`
        : "";

      btn.innerHTML = `${escapeHtml(tab.name)} ${closeHtml}`;
      tabsBar.appendChild(btn);
    });

    const addBtn = document.createElement("button");
    addBtn.className = "btn-add-tab";
    addBtn.textContent = "+ New Tab";
    addBtn.onclick = addNewTab;
    tabsBar.appendChild(addBtn);
  }

  function render() {
    renderTabs();
    const activeTab = getActiveTab();
    document.getElementById("active-tab-name").value = activeTab.name;
    document.getElementById("combine-tabs-checkbox").checked = appState.combineAll;

    const container = document.getElementById("categories-container");
    container.innerHTML = "";

    activeTab.categories.forEach((cat, catIndex) => {
      const card = document.createElement("div");
      card.className = "category-card";

      let catWeight = 0;
      let catEarned = 0;

      const rowsHtml = cat.items.map((item, itemIndex) => {
        const scoreNum = parseFloat(item.score);
        const maxNum = parseFloat(item.max);
        const weightNum = parseFloat(item.weight) || 0;

        let earned = 0;
        if (!isNaN(scoreNum) && maxNum > 0) {
          earned = (scoreNum / maxNum) * weightNum;
        }

        catWeight += weightNum;
        catEarned += earned;

        return `
          <tr>
            <td style="width: 30%;">
              <input type="text" value="${escapeHtml(item.subject)}"
                placeholder="Subject Name"
                oninput="updateItem(${catIndex}, ${itemIndex}, 'subject', this.value)" />
            </td>
            <td style="width: 17%;">
              <input type="number" step="any" min="0" value="${item.score}"
                placeholder="Score"
                oninput="updateItem(${catIndex}, ${itemIndex}, 'score', this.value)" />
            </td>
            <td style="width: 17%;">
              <input type="number" step="any" min="1" value="${item.max}"
                placeholder="Max"
                oninput="updateItem(${catIndex}, ${itemIndex}, 'max', this.value)" />
            </td>
            <td style="width: 17%;">
              <input type="number" step="any" min="0" value="${item.weight}"
                placeholder="Weight"
                oninput="updateItem(${catIndex}, ${itemIndex}, 'weight', this.value)" />
            </td>
            <td style="width: 14%;">
              <span class="earned-badge" id="earned-${catIndex}-${itemIndex}">
                ${earned.toFixed(2)} pts
              </span>
            </td>
            <td style="width: 5%; text-align: right;">
              <button class="btn-danger-ghost" title="Remove Item"
                onclick="removeItem(${catIndex}, ${itemIndex})">&times;</button>
            </td>
          </tr>
        `;
      }).join("");

      card.innerHTML = `
        <div class="category-header">
          <input class="category-title-input" type="text" value="${escapeHtml(cat.name)}"
            oninput="updateCategoryName(${catIndex}, this.value)" />
          <button class="btn-danger-ghost" title="Delete Section"
            onclick="removeCategory(${catIndex})">Delete Section</button>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Subject / Item</th>
                <th>Your Score</th>
                <th>Total Items</th>
                <th>Weight (pts)</th>
                <th>Weighted Pts</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
            <tfoot>
              <tr>
                <td colspan="3">SECTION TOTAL</td>
                <td id="cat-weight-total-${catIndex}">${catWeight} pts</td>
                <td class="section-total-earned" id="cat-earned-total-${catIndex}">
                  ${catEarned.toFixed(2)} / ${catWeight}
                </td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>

        <div class="card-footer">
          <button class="btn-outline" onclick="addItem(${catIndex})">+ Add Subject / Item</button>
        </div>
      `;

      container.appendChild(card);
    });

    recalculateTotals();
  }

  function updateItem(catIndex, itemIndex, field, value) {
    const activeTab = getActiveTab();
    activeTab.categories[catIndex].items[itemIndex][field] = value;
    saveData();
    recalculateTotals();
  }

  function updateCategoryName(catIndex, value) {
    const activeTab = getActiveTab();
    activeTab.categories[catIndex].name = value;
    saveData();
  }

  function addItem(catIndex) {
    const activeTab = getActiveTab();
    activeTab.categories[catIndex].items.push({
      id: Date.now(),
      subject: "New Subject",
      score: "",
      max: 50,
      weight: 5
    });
    saveData();
    render();
  }

  function removeItem(catIndex, itemIndex) {
    const activeTab = getActiveTab();
    activeTab.categories[catIndex].items.splice(itemIndex, 1);
    saveData();
    render();
  }

  function addCategory() {
    const activeTab = getActiveTab();
    activeTab.categories.push({
      id: Date.now(),
      name: "NEW SECTION",
      items: [
        { id: Date.now() + 1, subject: "Subject 1", score: "", max: 50, weight: 10 }
      ]
    });
    saveData();
    render();
  }

  function removeCategory(catIndex) {
    const activeTab = getActiveTab();
    if (confirm("Remove this entire section?")) {
      activeTab.categories.splice(catIndex, 1);
      saveData();
      render();
    }
  }

  function resetToDefault() {
    if (confirm("Reset everything back to the original ECE Review template?")) {
      appState = {
        activeTabId: "tab-1",
        combineAll: false,
        tabs: structuredClone(defaultTabs)
      };
      saveData();
      render();
    }
  }

  function calculateTabTotals(tab) {
    let tabEarned = 0;
    let tabWeight = 0;

    tab.categories.forEach(cat => {
      cat.items.forEach(item => {
        const score = parseFloat(item.score);
        const max = parseFloat(item.max);
        const weight = parseFloat(item.weight) || 0;

        if (!isNaN(score) && max > 0) {
          tabEarned += (score / max) * weight;
        }
        tabWeight += weight;
      });
    });

    return { earned: tabEarned, weight: tabWeight };
  }

  function recalculateTotals() {
    const activeTab = getActiveTab();

    // Update active tab DOM rows & section footers
    activeTab.categories.forEach((cat, catIndex) => {
      let catEarned = 0;
      let catWeight = 0;

      cat.items.forEach((item, itemIndex) => {
        const score = parseFloat(item.score);
        const max = parseFloat(item.max);
        const weight = parseFloat(item.weight) || 0;

        let earned = 0;
        if (!isNaN(score) && max > 0) {
          earned = (score / max) * weight;
        }

        catEarned += earned;
        catWeight += weight;

        const earnedEl = document.getElementById(`earned-${catIndex}-${itemIndex}`);
        if (earnedEl) earnedEl.textContent = `${earned.toFixed(2)} pts`;
      });

      const catWeightEl = document.getElementById(`cat-weight-total-${catIndex}`);
      const catEarnedEl = document.getElementById(`cat-earned-total-${catIndex}`);

      if (catWeightEl) catWeightEl.textContent = `${catWeight} pts`;
      if (catEarnedEl) catEarnedEl.textContent = `${catEarned.toFixed(2)} / ${catWeight}`;
    });

    // Calculate Scoreboard Totals (either active tab or combined across all tabs)
    let displayEarned = 0;
    let displayWeight = 0;

    if (appState.combineAll) {
      appState.tabs.forEach(tab => {
        const res = calculateTabTotals(tab);
        displayEarned += res.earned;
        displayWeight += res.weight;
      });
      document.getElementById("points-label").textContent = "Combined Weighted Points";
      document.getElementById("points-subtext").textContent = `Combined across ${appState.tabs.length} tabs`;
    } else {
      const res = calculateTabTotals(activeTab);
      displayEarned = res.earned;
      displayWeight = res.weight;
      document.getElementById("points-label").textContent = "Total Weighted Points";
      document.getElementById("points-subtext").textContent = `Points in "${activeTab.name}"`;
    }

    const maxScale = displayWeight > 0 ? displayWeight : 100;
    const percentage = displayWeight > 0 ? (displayEarned / displayWeight) * 100 : 0;

    document.getElementById("total-points").textContent = `${displayEarned.toFixed(2)} / ${maxScale}`;
    document.getElementById("total-grade").textContent = `${percentage.toFixed(2)}%`;

    // Progress Bar Update
    const progressEl = document.getElementById("grade-progress-bar");
    const clampedPct = Math.min(100, Math.max(0, percentage));
    progressEl.style.width = `${clampedPct}%`;

    const weightEl = document.getElementById("total-weight");
    const statusEl = document.getElementById("weight-status");
    weightEl.textContent = `${displayWeight}%`;

    weightEl.className = "stat-value";
    if (Math.abs(displayWeight - 100) < 0.001) {
      weightEl.classList.add("weight-ok");
      statusEl.textContent = "Balanced at 100%";
      statusEl.style.color = "var(--success)";
    } else if (displayWeight < 100) {
      weightEl.classList.add("weight-warn");
      statusEl.textContent = `${(100 - displayWeight).toFixed(2)}% remaining to reach 100%`;
      statusEl.style.color = "var(--warning)";
    } else {
      weightEl.classList.add("weight-over");
      statusEl.textContent = `${(displayWeight - 100).toFixed(2)}% over 100%`;
      statusEl.style.color = "var(--danger)";
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  render();
</script>

</body>
</html>
